<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>文件详情</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #233047; background: linear-gradient(145deg, #edf5f3, #f8f5ed); font-family: "Microsoft YaHei", sans-serif; }
        main { width: min(720px, 100%); min-width: 0; padding: 36px; background: #fff; border: 1px solid #dfe8e5; border-radius: 12px; box-shadow: 0 18px 48px #23304714; }
        .status { display: flex; align-items: center; gap: 9px; color: #087f70; font-size: 14px; font-weight: 700; }
        .status::before { width: 9px; height: 9px; content: ""; border-radius: 50%; background: #16a085; }
        h1 { margin: 14px 0 8px; font-size: 30px; }
        .intro { margin: 0 0 24px; color: #68758a; line-height: 1.7; }
        .details { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
        .detail:first-child { grid-column: 1 / -1; }
        .detail { min-width: 0; padding: 14px; background: #f5f8f7; border-radius: 8px; }
        .detail span { display: block; margin-bottom: 6px; color: #68758a; font-size: 13px; }
        .detail strong { display: block; overflow-wrap: anywhere; font-size: 15px; }
        .preview { padding: 18px; border: 1px solid #e3e9e7; border-radius: 8px; }
        .preview h2 { margin: 0 0 12px; font-size: 17px; }
        .preview p { margin: 0; color: #68758a; line-height: 1.7; }
        .analysis { min-width: 0; max-width: 100%; margin-top: 16px; padding: 18px; background: #f5f8f7; border-radius: 8px; }
        .analysis h2 { margin: 0 0 12px; font-size: 17px; }
        .analysis h3 { margin: 18px 0 8px; font-size: 16px; }
        .analysis h4 { margin: 16px 0 8px; font-size: 14px; }
        .analysis p { margin: 0; color: #68758a; line-height: 1.7; }
        .analysis ul { margin: 0; padding-left: 20px; color: #475467; line-height: 1.8; }
        .analysis-table-wrap { width: 100%; min-width: 0; max-width: 100%; overflow-x: auto; }
        .analysis-table { width: max-content; min-width: 100%; margin-bottom: 12px; border-collapse: collapse; font-size: 13px; text-align: left; }
        .analysis-table th, .analysis-table td { padding: 8px; border-bottom: 1px solid #e3e9e7; white-space: nowrap; }
        pre { max-height: 360px; margin: 0; overflow: auto; color: #344054; font: 14px/1.65 Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
        .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-top: 24px; }
        .actions form { margin: 0; }
        button { min-height: 44px; padding: 0 20px; color: #fff; background: #087f70; border: 0; border-radius: 6px; font: inherit; font-weight: 700; cursor: pointer; }
        button:hover { background: #06695d; }
        button.delete { color: #a33b31; background: #fff0ed; border: 1px solid #f1c8c2; }
        button.delete:hover { background: #ffe2dc; }
        .secondary { color: #475467; text-decoration: none; font-size: 14px; }
        .secondary:hover { text-decoration: underline; }
        @media (max-width: 560px) { main { padding: 24px; } .details { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <main>
        <div class="status">文件详情</div>
        <h1>${filename}</h1>
        <p class="intro">该文件已保存到你的账号，可以在此查看或下载。</p>
        <section class="details" aria-label="文件信息">
            <div class="detail"><span>文件名</span><strong>${filename}</strong></div>
            <div class="detail"><span>文件大小</span><strong>${file_size} 字节</strong></div>
            <div class="detail"><span>记录编号</span><strong>${upload_id}</strong></div>
            <div class="detail"><span>文件类型</span><strong>${content_type}</strong></div>
            <div class="detail"><span>上传时间</span><strong>${uploaded_at}</strong></div>
        </section>
        ${text_preview}
        ${analysis}
        <div class="actions">
            <button type="button" onclick="downloadUploadedFile()">下载文件</button>
            <form method="get" action="/post/${upload_id}">
                <input type="hidden" name="analyze" value="1">
                <button type="submit">分析文件</button>
            </form>
            <form method="post" action="/delete/${upload_id}" onsubmit="return confirm('确定删除这个文件吗？')">
                <button class="delete" type="submit">删除文件</button>
            </form>
            <a class="secondary" href="/">继续上传</a>
        </div>
    </main>
    <script>
        function downloadUploadedFile() {
            window.location.href = "/download/${upload_id}";
        }
    </script>
</body>
</html>
