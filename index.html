<!DOCTYPE html>
<html lang="${language}">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>${site_title}</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			font-family: "Microsoft YaHei", sans-serif;
			color: #233047;
			background: linear-gradient(135deg, #e8f4ff, #f8f2ff);
		}
		header { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 22px 8%; background: #fff; box-shadow: 0 2px 12px #24344a12; }
		header strong { color: #536dfe; font-size: 20px; }
		.account { display: flex; align-items: center; gap: 14px; color: #68758a; font-size: 14px; }
		.account form { margin: 0; }
		.account button { margin: 0; padding: 8px 14px; font-size: 14px; }
		.language-switch { display: flex; gap: 8px; font-size: 14px; }
		.language-switch a { display: inline-block; padding: 8px 12px; color: #087f70; background: #f1f5f4; border: 1px solid #dfe8e5; border-radius: 6px; text-decoration: none; white-space: nowrap; }
		.language-switch a:hover { background: #e5efec; }
		main { max-width: 760px; margin: 12vh auto; padding: 24px; text-align: center; }
		.card { padding: 56px 28px; background: #fff; border-radius: 20px; box-shadow: 0 16px 45px #24344a18; }
		.records { margin-top: 20px; padding: 24px; background: #fff; border-radius: 12px; box-shadow: 0 8px 28px #24344a12; text-align: left; }
		.records h2 { margin: 0 0 16px; font-size: 20px; }
		.table-wrap { overflow-x: auto; }
		table { width: 100%; border-collapse: collapse; text-align: left; }
		th, td { padding: 12px 10px; border-bottom: 1px solid #e7eceb; font-size: 14px; white-space: nowrap; }
		th { color: #68758a; font-size: 13px; font-weight: 600; }
		td:first-child { white-space: normal; overflow-wrap: anywhere; }
		td a { color: #087f70; font-weight: 600; }
		.delete-form { margin: 0; }
		.delete-button { margin: 0; padding: 7px 12px; color: #a33b31; background: #fff0ed; border: 1px solid #f1c8c2; border-radius: 6px; font-size: 13px; }
		.delete-button:hover { background: #ffe2dc; }
		.empty { color: #68758a; }
		h1 { margin: 0 0 14px; font-size: clamp(32px, 7vw, 52px); }
		p { color: #68758a; line-height: 1.8; }
		button { margin-top: 16px; padding: 12px 24px; color: #fff; background: #536dfe; border: 0; border-radius: 8px; font-size: 16px; cursor: pointer; }
		button:hover { background: #4058e8; }
		footer { margin-top: 28px; color: #8792a4; font-size: 14px; }
	</style>
</head>
<body>
	<header>
		<strong>${site_title}</strong>
		<div class="account">
			<span>${logged_in}</span>
			<form method="post" action="/logout"><button type="submit">${logout}</button></form>
			${language_switch}
		</div>
	</header>
	<main>
		<section class="card">
			<h1>${greeting}</h1>
			<p>${welcome}<br>${wish}</p>
			<form method="post" action="/button-click" enctype="multipart/form-data">
				<input type="file" name="file" accept=".pdf,.jpg,.jpeg,.png,.txt,.md,.xls,.xlsx,.csv,.log,.json" required>
				<button type="submit">${upload}</button>
			</form>
		</section>
		<section class="records">
			<h2>${my_uploads}</h2>
			${upload_records}
		</section>
		<footer>${footer}</footer>
	</main>
</body>
</html>
