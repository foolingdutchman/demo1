<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>登录或注册</title>
	<style>
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #233047; background: linear-gradient(145deg, #edf5f3, #f8f5ed); font-family: "Microsoft YaHei", sans-serif; }
		.page-nav { position: absolute; top: 16px; left: 24px; right: 24px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
		.back-link { display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px; color: #087f70; background: #fff; border: 1px solid #dfe8e5; border-radius: 6px; font-size: 14px; text-decoration: none; }
		.back-link:hover { background: #f1f5f4; }
		main { width: min(440px, 100%); padding: 36px; background: #fff; border: 1px solid #dfe8e5; border-radius: 12px; box-shadow: 0 18px 48px #23304714; }
		.eyebrow { margin: 0 0 10px; color: #087f70; font-size: 13px; font-weight: 700; }
		h1 { margin: 0; font-size: 30px; }
		.intro { margin: 10px 0 24px; color: #68758a; line-height: 1.7; }
		.notice { margin: 0 0 18px; padding: 12px 14px; color: #9c2f25; background: #fff0ed; border-radius: 6px; }
		.notice:empty { display: none; }
		.mode-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 22px; padding: 4px; background: #f1f5f4; border-radius: 8px; }
		button { min-height: 42px; color: #fff; background: #087f70; border: 0; border-radius: 6px; font: inherit; font-weight: 700; cursor: pointer; }
		.mode-switch button { color: #52615f; background: transparent; }
		.mode-switch button[aria-pressed="true"] { color: #087f70; background: #fff; box-shadow: 0 1px 4px #2330471a; }
		label { display: block; margin: 0 0 7px; color: #475467; font-size: 14px; font-weight: 700; }
		input { width: 100%; min-height: 44px; margin-bottom: 16px; padding: 10px 12px; color: #233047; background: #fff; border: 1px solid #cfd9d6; border-radius: 6px; font: inherit; }
		input:focus { outline: 3px solid #087f7030; border-color: #087f70; }
		#submit-button { width: 100%; }
		.hint { margin: 12px 0 0; color: #68758a; font-size: 13px; line-height: 1.6; }
		.language-switch { display: flex; gap: 10px; font-size: 14px; }
		.language-switch button { min-height: auto; padding: 0; color: #087f70; background: transparent; font-weight: 400; }
		@media (max-width: 640px) { main { padding: 24px; } }
	</style>
</head>
<body data-page="login">
	<nav class="page-nav" aria-label="Page navigation">
		<a class="back-link" href="index.html" data-i18n="site.back_home"></a>
		<div class="language-switch" id="language-switch"></div>
	</nav>
	<main>
		<p class="eyebrow" data-i18n="auth.eyebrow"></p>
		<h1 id="page-title"></h1>
		<p class="intro" id="page-intro"></p>
		<p class="notice" id="notice" role="alert"></p>
		<div class="mode-switch" role="group" id="mode-label">
			<button id="login-mode" type="button" aria-pressed="true"></button>
			<button id="register-mode" type="button" aria-pressed="false"></button>
		</div>
		<form id="auth-form">
			<label for="username" data-i18n="auth.username"></label>
			<input id="username" name="username" autocomplete="username" minlength="3" maxlength="32" required>
			<label for="password" data-i18n="auth.password"></label>
			<input id="password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required>
			<div id="confirmation-field" hidden>
				<label for="confirm-password" data-i18n="auth.confirm_password"></label>
				<input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" maxlength="128">
				<p class="hint" data-i18n="auth.password_hint"></p>
			</div>
			<button type="submit" id="submit-button"></button>
		</form>
	</main>
	<script src="api-config.js"></script>
	<script src="client.js"></script>
	<script src="app.js"></script>
</body>
</html>
