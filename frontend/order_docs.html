<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>订单单据管理</title>
	<style>
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; color: #233047; background: linear-gradient(145deg, #edf5f3, #f8f5ed); font-family: "Microsoft YaHei", sans-serif; }
		header { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 22px 8%; background: #fff; }
		.brand { color: #087f70; font-size: 20px; font-weight: 700; text-decoration: none; }
		.account { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; color: #68758a; font-size: 14px; }
		a { color: #087f70; }
		button { min-height: 38px; padding: 8px 14px; color: #fff; background: #087f70; border: 0; border-radius: 7px; font: inherit; cursor: pointer; }
		button:disabled { opacity: .6; cursor: default; }
		.language-switch { display: flex; gap: 8px; }
		.language-switch button, .secondary { color: #087f70; background: #f1f5f4; border: 1px solid #dfe8e5; }
		main { width: min(1000px, 100%); margin: 4vh auto; padding: 0 24px; }
		.card { padding: 28px; background: #fff; border-radius: 16px; box-shadow: 0 12px 35px #24344a12; }
		h1 { margin: 0 0 8px; font-size: clamp(24px, 5vw, 34px); }
		.hint, .empty, .meta { color: #68758a; }
		.notice { color: #9c2f25; }
		.status { color: #087f70; }
		.notice:empty, .status:empty { display: none; }
		.document-list { display: grid; gap: 14px; margin-top: 22px; }
		.document-row { display: grid; grid-template-columns: minmax(150px, 1fr) minmax(200px, 2fr) auto; align-items: center; gap: 16px; padding: 18px; border: 1px solid #dfe8e5; border-radius: 10px; }
		.document-title { font-weight: 700; }
		.filename { font-weight: 600; overflow-wrap: anywhere; }
		.related-file { padding: 7px 0; }
		.related-file + .related-file { border-top: 1px solid #e7eceb; }
		.related-file-summary { overflow-wrap: anywhere; }
		.actions { display: flex; flex-wrap: wrap; gap: 8px; }
		.actions.related-actions { grid-column: 2 / -1; display: grid; gap: 8px; }
		.related-document-actions { display: grid; gap: 8px; width: 100%; }
		.related-document-row { display: grid; grid-template-columns: minmax(180px, 1fr) auto auto; align-items: center; gap: 8px; }
		.related-document-name { min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
		.related-upload-row { display: flex; padding-top: 4px; border-top: 1px solid #e7eceb; }
		.related-upload-row .upload-row { margin-top: 8px; }
		.delete { color: #a33b31; background: #fff0ed; border: 1px solid #f2d3ce; }
		.document-review-dialog { width: min(760px, 100%); }
		.review-field { display: grid; gap: 7px; margin-top: 14px; color: #46546a; font-size: 13px; }
		.review-field textarea { width: 100%; min-height: 76px; padding: 10px; border: 1px solid #cbd6d3; border-radius: 7px; font: inherit; resize: vertical; }
		.waybill-editor { width: 100%; min-width: 0; max-width: 100%; margin-top: 12px; overflow-x: auto; }
		.waybill-section { min-width: 0; padding: 18px; border: 1px solid #dfe8e5; border-radius: 10px; background: #fff; }
		.waybill-section h2 { margin: 0 0 10px; font-size: 18px; }
		.waybill-caption { margin-top: 8px; color: #46546a; font-size: 13px; font-weight: 600; }
		.waybill-table { width: max-content; min-width: 100%; border-collapse: collapse; }
		.waybill-table th, .waybill-table td { padding: 7px; border: 1px solid #dfe8e5; text-align: left; white-space: nowrap; }
		.waybill-table th { color: #46546a; background: #f7faf9; font-size: 12px; }
		.waybill-table input { min-width: 120px; width: 100%; padding: 6px; border: 1px solid #cbd6d3; border-radius: 5px; font: inherit; font-size: 12px; }
		.waybill-table th:last-child, .waybill-table td:last-child { width: 150px; }
		.waybill-row-actions { display: flex; flex-wrap: wrap; gap: 6px; }
		footer { margin-top: 28px; color: #8792a4; font-size: 14px; text-align: center; }
		@media (max-width: 700px) { header { align-items: flex-start; flex-direction: column; } main { padding: 0 16px; } .card { padding: 20px; } .document-row { grid-template-columns: 1fr; } .actions.related-actions { grid-column: auto; } .related-document-row { grid-template-columns: 1fr auto auto; } }
	</style>
</head>
<body data-page="order-docs">
	<header>
		<a class="brand" href="assets.html" data-i18n="site.title"></a>
		<div class="account">
			<span id="username"></span>
			<a id="order-docs-back" href="order.html" data-i18n="order.back_to_detail"></a>
			<button id="logout-button" type="button" data-i18n="site.logout"></button>
			<div class="language-switch" id="language-switch"></div>
		</div>
	</header>
	<main>
		<section class="card">
			<h1 data-i18n="order.documents_title"></h1>
			<p class="hint" id="order-docs-heading"></p>
			<p class="notice" id="notice" role="alert"></p>
			<p class="status" id="order-docs-status" role="status"></p>
			<div class="document-list" id="order-docs-list" aria-live="polite">
				<div class="document-row">
					<div class="document-title" data-i18n="order.document.purchase_contract"></div>
					<div class="empty" data-i18n="order.document.empty"></div>
					<div class="actions"><button type="button" data-i18n="order.contract"></button></div>
				</div>
				<div class="document-row">
					<div class="document-title" data-i18n="order.document.related_documents"></div>
					<div class="empty" data-i18n="order.document.empty"></div>
					<div class="actions"><button type="button" data-i18n="order.document.upload"></button></div>
				</div>
				<div class="document-row">
					<div class="document-title" data-i18n="order.document.sales_contract"></div>
					<div class="empty" data-i18n="order.document.empty"></div>
					<div class="actions"></div>
				</div>
				<div class="document-row">
					<div class="document-title" data-i18n="order.document.order_contract"></div>
					<div class="empty" data-i18n="order.document.empty"></div>
					<div class="actions"></div>
				</div>
			</div>
		</section>
		<footer data-i18n="site.footer"></footer>
	</main>
	<script src="api-config.js"></script>
	<script src="client.js"></script>
	<script src="order_docs.js?v=20261127-1727"></script>
	<script src="app.js?v=20261125-2025"></script>
</body>
</html>
