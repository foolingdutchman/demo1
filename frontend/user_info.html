<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>用户信息</title>
	<style>
		* { box-sizing: border-box; }
		[hidden] { display: none !important; }
		body { margin: 0; min-height: 100vh; color: #233047; background: linear-gradient(145deg, #edf5f3, #f8f5ed); font-family: "Microsoft YaHei", sans-serif; }
		header { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 22px 8%; background: #fff; }
		.brand { color: #087f70; font-size: 20px; font-weight: 700; text-decoration: none; }
		.account { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; color: #68758a; font-size: 14px; }
		a { color: #087f70; }
		button { min-height: 38px; padding: 8px 14px; color: #fff; background: #087f70; border: 0; border-radius: 7px; font: inherit; cursor: pointer; }
		button:disabled { opacity: .6; cursor: default; }
		.language-switch { display: flex; gap: 8px; }
		.language-switch button { color: #087f70; background: #f1f5f4; border: 1px solid #dfe8e5; }
		main { width: min(900px, 100%); margin: 4vh auto; padding: 0 24px; }
		.card { padding: 28px; background: #fff; border-radius: 16px; box-shadow: 0 12px 35px #24344a12; }
		h1 { margin: 0 0 8px; font-size: clamp(24px, 5vw, 34px); }
		h2 { margin: 30px 0 12px; font-size: 19px; }
		.hint, .readonly { color: #68758a; }
		.fields { display: grid; gap: 16px; }
		label { display: grid; gap: 6px; color: #46546a; font-size: 13px; }
		input, textarea { width: 100%; padding: 10px; border: 1px solid #cbd6d3; border-radius: 7px; font: inherit; }
		input[readonly] { color: #68758a; background: #f5f7f7; }
		textarea { min-height: 100px; resize: vertical; }
		.actions { display: flex; gap: 10px; margin-top: 16px; }
		.notice { color: #9c2f25; }
		.status { color: #087f70; }
		.notice:empty, .status:empty { display: none; }
		footer { margin-top: 28px; color: #8792a4; font-size: 14px; text-align: center; }
		@media (max-width: 640px) { header { align-items: flex-start; flex-direction: column; } main { padding: 0 16px; } .card { padding: 20px; } }
	</style>
</head>
<body data-page="user-info">
	<header>
		<a class="brand" href="assets.html" data-i18n="site.title"></a>
		<div class="account">
			<span id="username"></span>
			<a href="assets.html" data-i18n="site.back_home"></a>
			<button id="logout-button" type="button" data-i18n="site.logout"></button>
			<div class="language-switch" id="language-switch"></div>
		</div>
	</header>
	<main>
		<section class="card">
			<h1 data-i18n="profile.title"></h1>
			<p class="hint" data-i18n="profile.intro"></p>
			<p class="notice" id="notice" role="alert"></p>
			<p class="status" id="profile-status" role="status"></p>
			<form id="profile-form">
				<div class="fields">
					<label>
						<span data-i18n="auth.username"></span>
						<input id="profile-username" type="text" readonly>
					</label>
					<label>
						<span data-i18n="profile.company_name"></span>
						<input id="profile-company-name" name="company_name" type="text" maxlength="500">
					</label>
					<label>
						<span data-i18n="profile.company_address"></span>
						<textarea id="profile-company-address" name="company_address" maxlength="2000"></textarea>
					</label>
					<label>
						<span data-i18n="profile.foreign_bank_account"></span>
						<textarea id="profile-foreign-bank" name="foreign_bank_account" maxlength="2000"></textarea>
					</label>
					<label>
						<span data-i18n="profile.cny_bank_account"></span>
						<textarea id="profile-cny-bank" name="cny_bank_account" maxlength="2000"></textarea>
					</label>
				</div>
				<div class="actions">
					<button id="profile-save" type="submit" data-i18n="profile.save"></button>
				</div>
			</form>
			<h2 data-i18n="profile.change_password"></h2>
			<p class="hint" data-i18n="profile.password_intro"></p>
			<form id="password-form">
				<div class="fields">
					<label>
						<span data-i18n="profile.current_password"></span>
						<input id="profile-current-password" name="current_password" type="password" autocomplete="current-password" required>
					</label>
					<label>
						<span data-i18n="profile.new_password"></span>
						<input id="profile-new-password" name="new_password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
					</label>
					<label>
						<span data-i18n="profile.confirm_password"></span>
						<input id="profile-confirm-password" name="confirm_password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
					</label>
				</div>
				<div class="actions">
					<button id="profile-password-save" type="submit" data-i18n="profile.change_password"></button>
				</div>
			</form>
		</section>
		<footer data-i18n="site.footer"></footer>
	</main>
	<script src="api-config.js"></script>
	<script src="client.js"></script>
	<script src="user_info.js"></script>
	<script src="app.js"></script>
</body>
</html>
