<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>我的小网站</title>
	<style>
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; font-family: "Microsoft YaHei", sans-serif; color: #233047; background: linear-gradient(135deg, #e8f4ff, #f8f2ff); }
		header { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 22px 8%; background: #fff; box-shadow: 0 2px 12px #24344a12; }
		.brand { color: #536dfe; font-size: 20px; font-weight: 700; text-decoration: none; }
		.account { display: flex; align-items: center; gap: 14px; color: #68758a; font-size: 14px; }
		.language-switch { display: flex; gap: 8px; }
		button { min-height: 40px; padding: 8px 14px; color: #fff; background: #536dfe; border: 0; border-radius: 7px; font: inherit; cursor: pointer; }
		button:hover { background: #4058e8; }
		.language-switch button { min-height: 34px; padding: 5px 10px; color: #087f70; background: #f1f5f4; border: 1px solid #dfe8e5; }
		main { max-width: 760px; margin: 3vh auto; padding: 24px; text-align: center; }
		.card, .records { background: #fff; border-radius: 16px; box-shadow: 0 12px 35px #24344a12; }
		.card { margin-top: 20px; padding: 48px 28px; }
		.records { margin-top: 20px; padding: 24px; text-align: left; }
		h1 { margin: 0 0 14px; font-size: clamp(32px, 7vw, 52px); }
		p { color: #68758a; line-height: 1.8; }
		.upload-form { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px; margin-top: 22px; }
		.records h2 { margin: 0 0 16px; font-size: 20px; }
		.table-wrap { overflow-x: auto; }
		table { width: 100%; border-collapse: collapse; text-align: left; }
		th, td { padding: 12px 10px; border-bottom: 1px solid #e7eceb; font-size: 14px; }
		th { color: #68758a; font-size: 13px; }
		td:first-child { overflow-wrap: anywhere; }
		td a { color: #087f70; font-weight: 600; }
		.delete-button { color: #a33b31; background: #fff0ed; border: 1px solid #f1c8c2; }
		.empty { color: #68758a; }
		.notice { margin: 14px 0; color: #9c2f25; }
		.notice:empty { display: none; }
		.view-all { display: inline-flex; margin-top: 16px; padding: 10px 16px; color: #fff; background: #536dfe; border-radius: 7px; font-weight: 700; text-decoration: none; }
		.market { margin-top: 0; padding: 24px; background: #fff; border: 1px solid #e7eceb; border-radius: 16px; box-shadow: 0 12px 35px #24344a12; text-align: left; }
		.market-heading { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 20px; }
		.market-heading h2 { margin: 0 0 6px; font-size: 20px; }
		.market-heading p, .market-updated { margin: 0; color: #68758a; font-size: 14px; }
		.market-prices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
		.market-price { display: block; min-width: 0; padding: 16px; color: inherit; background: #f8fafc; border: 1px solid #e7eceb; border-radius: 10px; text-decoration: none; }
		.market-price:hover, .market-price:focus-visible { border-color: #9dc9c2; outline: 2px solid #087f7030; }
		.market-price h3 { margin: 0 0 10px; color: #68758a; font-size: 14px; }
		.market-value { margin: 0; color: #233047; font-size: clamp(18px, 2.5vw, 24px); font-weight: 700; overflow-wrap: anywhere; }
		.market-unit { margin: 6px 0 0; color: #8792a4; font-size: 13px; }
		.market-derived { margin-top: 12px; padding-top: 10px; border-top: 1px solid #e7eceb; }
		.market-derived-label, .market-derived-unit { display: block; color: #68758a; font-size: 12px; line-height: 1.6; }
		.market-derived-value { display: block; margin-top: 3px; color: #087f70; font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
		.market-status { margin: 16px 0 0; color: #68758a; font-size: 14px; }
		.market-status:empty { display: none; }
		footer { margin-top: 28px; color: #8792a4; font-size: 14px; }
		@media (max-width: 640px) {
			header { align-items: flex-start; flex-direction: column; }
			main { margin: 2vh auto; }
			.market-prices { grid-template-columns: 1fr; }
			.market-heading { flex-direction: column; }
		}
	</style>
</head>
<body data-page="assets">
	<header>
		<a class="brand" href="assets.html" data-i18n="site.title"></a>
		<div class="account">
			<span id="username"></span>
			<a href="order.html" data-i18n="order.list_title"></a>
			<button id="logout-button" type="button" data-i18n="site.logout"></button>
			<div class="language-switch" id="language-switch"></div>
		</div>
	</header>
	<main>
		<section class="market" aria-labelledby="market-title">
			<div class="market-heading">
				<div>
					<h2 id="market-title" data-i18n="market.title"></h2>
					<p data-i18n="market.description"></p>
				</div>
				<button id="market-refresh" type="button" data-i18n="market.refresh"></button>
			</div>
			<div class="market-prices" id="market-prices" aria-live="polite">
				<a class="market-price" href="financial_assets_marketing_detail.html?asset=gold&amp;return=assets">
					<h3 data-i18n="market.gold"></h3>
					<p class="market-value" data-market-value="gold" data-i18n="market.loading"></p>
					<p class="market-unit" data-i18n="market.gold_unit"></p>
				</a>
				<a class="market-price" href="financial_assets_marketing_detail.html?asset=btc&amp;return=assets">
					<h3 data-i18n="market.btc"></h3>
					<p class="market-value" data-market-value="btc" data-i18n="market.loading"></p>
					<p class="market-unit" data-i18n="market.crypto_unit"></p>
				</a>
				<a class="market-price" href="financial_assets_marketing_detail.html?asset=eth&amp;return=assets">
					<h3 data-i18n="market.eth"></h3>
					<p class="market-value" data-market-value="eth" data-i18n="market.loading"></p>
					<p class="market-unit" data-i18n="market.crypto_unit"></p>
				</a>
				<a class="market-price" href="financial_assets_marketing_detail.html?asset=ice_cotton&amp;return=assets">
					<h3 data-i18n="market.ice_cotton"></h3>
					<p class="market-value" data-market-value="ice_cotton" data-i18n="market.loading"></p>
					<p class="market-unit" data-i18n="market.ice_cotton_unit"></p>
				</a>
				<a class="market-price" href="financial_assets_marketing_detail.html?asset=zce_cotton&amp;return=assets">
					<h3 data-i18n="market.zce_cotton"></h3>
					<p class="market-value" data-market-value="zce_cotton" data-i18n="market.loading"></p>
					<p class="market-unit" data-i18n="market.zce_cotton_unit"></p>
					<div class="market-derived">
						<span class="market-derived-label" data-i18n="market.import_cotton_price"></span>
						<strong class="market-derived-value" data-market-derived="import_cotton" data-i18n="market.loading"></strong>
						<span class="market-derived-unit" data-i18n="market.import_cotton_unit"></span>
					</div>
				</a>
				<a class="market-price" href="financial_assets_marketing_detail.html?asset=cc_index_3128b&amp;return=assets">
					<h3 data-i18n="market.cc_index_3128b"></h3>
					<p class="market-value" data-market-value="cc_index_3128b" data-i18n="market.loading"></p>
					<p class="market-unit" data-i18n="market.cc_index_unit"></p>
					<p class="market-unit" data-market-date="cc_index_3128b"></p>
				</a>
				<a class="market-price" href="financial_assets_marketing_detail.html?asset=cc_index_2227b&amp;return=assets">
					<h3 data-i18n="market.cc_index_2227b"></h3>
					<p class="market-value" data-market-value="cc_index_2227b" data-i18n="market.loading"></p>
					<p class="market-unit" data-i18n="market.cc_index_unit"></p>
					<p class="market-unit" data-market-date="cc_index_2227b"></p>
				</a>
				<a class="market-price" href="financial_assets_marketing_detail.html?asset=cc_index_2129b&amp;return=assets">
					<h3 data-i18n="market.cc_index_2129b"></h3>
					<p class="market-value" data-market-value="cc_index_2129b" data-i18n="market.loading"></p>
					<p class="market-unit" data-i18n="market.cc_index_unit"></p>
					<p class="market-unit" data-market-date="cc_index_2129b"></p>
				</a>
				<a class="market-price" href="financial_assets_marketing_detail.html?asset=usd_cny&amp;return=assets">
					<h3 data-i18n="market.usd_cny"></h3>
					<p class="market-value" data-market-value="usd_cny" data-i18n="market.loading"></p>
					<p class="market-unit" data-i18n="market.usd_cny_unit"></p>
				</a>
			</div>
			<p class="market-status" id="market-status" role="status"></p>
			<p class="market-updated" id="market-updated"></p>
		</section>
		<section class="card">
			<h1 data-i18n="site.upload_title"></h1>
			<p data-i18n="site.upload_hint"></p>
			<form class="upload-form" id="upload-form">
				<input id="upload-file" type="file" name="file" accept=".pdf,.jpg,.jpeg,.png,.txt,.md,.xls,.xlsx,.csv,.log,.json" required>
				<button type="submit" data-i18n="site.upload"></button>
			</form>
			<p class="notice" id="notice" role="alert"></p>
		</section>
		<section class="records">
			<h2 data-i18n="site.my_uploads"></h2>
			<div id="upload-list"></div>
			<a class="view-all" href="list.html" data-i18n="site.view_all"></a>
		</section>
		<footer data-i18n="site.footer"></footer>
	</main>
	<script src="api-config.js"></script>
	<script src="client.js"></script>
	<script src="app.js"></script>
</body>
</html>
