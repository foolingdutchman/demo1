<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>我的小网站</title>
	<style>
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; color: #233047; background: linear-gradient(135deg, #e8f4ff, #f8f2ff); font-family: "Microsoft YaHei", sans-serif; }
		header { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 18px 8%; background: #fff; box-shadow: 0 2px 12px #24344a12; }
		.brand { color: #536dfe; font-size: 20px; font-weight: 700; text-decoration: none; }
		.header-actions { display: flex; align-items: center; gap: 12px; }
		.language-switch { display: flex; gap: 8px; margin-right: 8px; }
		button { min-height: 38px; padding: 7px 14px; color: #087f70; background: #f1f5f4; border: 1px solid #dfe8e5; border-radius: 7px; font: inherit; cursor: pointer; }
		button:hover { background: #e5efec; }
		.register-link { padding: 9px 16px; color: #fff; background: #536dfe; border-radius: 7px; font-size: 14px; text-decoration: none; }
		.register-link:hover { background: #4058e8; }
		.login-link { color: #475467; font-size: 14px; text-decoration: none; }
		.login-link:hover { color: #087f70; }
		main { width: min(1060px, 100%); margin: 0 auto; padding: 10vh 24px 48px; }
		.hero { max-width: 760px; margin: 0 auto 56px; text-align: center; }
		.eyebrow { margin: 0 0 16px; color: #087f70; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
		h1 { margin: 0; font-size: clamp(36px, 7vw, 64px); line-height: 1.2; }
		.description { max-width: 620px; margin: 22px auto 28px; color: #68758a; font-size: 18px; line-height: 1.8; }
		.hero-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; }
		.hero-actions a { display: inline-block; padding: 13px 22px; border-radius: 8px; font-weight: 700; text-decoration: none; }
		.primary-action { color: #fff; background: #536dfe; }
		.primary-action:hover { background: #4058e8; }
		.secondary-action { color: #087f70; background: #fff; border: 1px solid #dfe8e5; }
		.features { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
		.feature { padding: 26px; background: #fff; border: 1px solid #e7eceb; border-radius: 14px; box-shadow: 0 10px 28px #24344a0d; }
		.feature h2 { margin: 0 0 10px; font-size: 19px; }
		.feature p { margin: 0; color: #68758a; line-height: 1.75; }
		.market { margin: 0 0 48px; padding: 26px; background: #fff; border: 1px solid #e7eceb; border-radius: 14px; box-shadow: 0 10px 28px #24344a0d; }
		.market-heading { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 20px; }
		.market-heading h2 { margin: 0 0 6px; font-size: 22px; }
		.market-heading p, .market-updated { margin: 0; color: #68758a; font-size: 14px; }
		.market-prices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
		.market-price { display: block; min-width: 0; padding: 20px; color: inherit; background: #f8fafc; border: 1px solid #e7eceb; border-radius: 10px; text-decoration: none; }
		.market-price:hover, .market-price:focus-visible { border-color: #9dc9c2; outline: 2px solid #087f7030; }
		.market-price h3 { margin: 0 0 12px; color: #68758a; font-size: 15px; }
		.market-value { margin: 0; color: #233047; font-size: clamp(20px, 3vw, 28px); font-weight: 700; overflow-wrap: anywhere; }
		.market-unit { margin: 6px 0 0; color: #8792a4; font-size: 13px; }
		.market-derived { margin-top: 12px; padding-top: 10px; border-top: 1px solid #e7eceb; }
		.market-derived-label, .market-derived-unit { display: block; color: #68758a; font-size: 12px; line-height: 1.6; }
		.market-derived-value { display: block; margin-top: 3px; color: #087f70; font-size: 17px; font-weight: 700; overflow-wrap: anywhere; }
		.market-status { margin: 16px 0 0; color: #68758a; font-size: 14px; }
		.market-status:empty { display: none; }
		footer { padding: 20px; color: #8792a4; font-size: 14px; text-align: center; }
		@media (max-width: 680px) {
			header { align-items: flex-start; flex-direction: column; padding: 16px 6%; }
			.header-actions { width: 100%; justify-content: space-between; gap: 8px; }
			.language-switch { margin-right: auto; }
			main { padding-top: 7vh; }
			.features { grid-template-columns: 1fr; }
			.market-prices { grid-template-columns: 1fr; }
			.market-heading { flex-direction: column; }
			.description { font-size: 16px; }
		}
	</style>
</head>
<body data-page="public">
	<header>
		<a class="brand" href="index.html" data-i18n="site.title"></a>
		<nav class="header-actions" aria-label="Account">
			<div class="language-switch" id="language-switch"></div>
			<a class="login-link" href="login.html?next=assets.html" data-i18n="auth.login"></a>
			<a class="register-link" href="login.html?mode=register&amp;next=assets.html" data-i18n="auth.register"></a>
		</nav>
	</header>
	<main>
		<section class="hero">
			<p class="eyebrow" data-i18n="site.public_eyebrow"></p>
			<h1 data-i18n="site.public_title"></h1>
			<p class="description" data-i18n="site.public_description"></p>
			<div class="hero-actions">
				<a class="primary-action" href="login.html?mode=register&amp;next=assets.html" data-i18n="site.public_get_started"></a>
				<a class="secondary-action" href="login.html?next=assets.html" data-i18n="auth.login"></a>
			</div>
		</section>
		<section class="market" aria-labelledby="market-title">
			<div class="market-heading">
				<div>
					<h2 id="market-title" data-i18n="market.title"></h2>
					<p data-i18n="market.description"></p>
				</div>
				<button id="market-refresh" type="button" data-i18n="market.refresh"></button>
			</div>
			<div class="market-prices" id="market-prices" aria-live="polite">
				<a class="market-price" href="financial_assets_marketing_detail.html?asset=gold&amp;return=index">
					<h3 data-i18n="market.gold"></h3>
					<p class="market-value" data-market-value="gold" data-i18n="market.loading"></p>
					<p class="market-unit" data-i18n="market.gold_unit"></p>
				</a>
				<a class="market-price" href="financial_assets_marketing_detail.html?asset=btc&amp;return=index">
					<h3 data-i18n="market.btc"></h3>
					<p class="market-value" data-market-value="btc" data-i18n="market.loading"></p>
					<p class="market-unit" data-i18n="market.crypto_unit"></p>
				</a>
				<a class="market-price" href="financial_assets_marketing_detail.html?asset=eth&amp;return=index">
					<h3 data-i18n="market.eth"></h3>
					<p class="market-value" data-market-value="eth" data-i18n="market.loading"></p>
					<p class="market-unit" data-i18n="market.crypto_unit"></p>
				</a>
				<a class="market-price" href="financial_assets_marketing_detail.html?asset=ice_cotton&amp;return=index">
					<h3 data-i18n="market.ice_cotton"></h3>
					<p class="market-value" data-market-value="ice_cotton" data-i18n="market.loading"></p>
					<p class="market-unit" data-i18n="market.ice_cotton_unit"></p>
				</a>
				<a class="market-price" href="/product/cotton?return=index">
					<h3 data-i18n="market.zce_cotton"></h3>
					<p class="market-value" data-market-value="zce_cotton" data-i18n="market.loading"></p>
					<p class="market-unit" data-i18n="market.zce_cotton_unit"></p>
					<div class="market-derived">
						<span class="market-derived-label" data-i18n="market.import_cotton_price"></span>
						<strong class="market-derived-value" data-market-derived="import_cotton" data-i18n="market.loading"></strong>
						<span class="market-derived-unit" data-i18n="market.import_cotton_unit"></span>
					</div>
				</a>
				<a class="market-price" href="financial_assets_marketing_detail.html?asset=cc_index_3128b&amp;return=index">
					<h3 data-i18n="market.cc_index_3128b"></h3>
					<p class="market-value" data-market-value="cc_index_3128b" data-i18n="market.loading"></p>
					<p class="market-unit" data-i18n="market.cc_index_unit"></p>
					<p class="market-unit" data-market-date="cc_index_3128b"></p>
				</a>
				<a class="market-price" href="financial_assets_marketing_detail.html?asset=cc_index_2227b&amp;return=index">
					<h3 data-i18n="market.cc_index_2227b"></h3>
					<p class="market-value" data-market-value="cc_index_2227b" data-i18n="market.loading"></p>
					<p class="market-unit" data-i18n="market.cc_index_unit"></p>
					<p class="market-unit" data-market-date="cc_index_2227b"></p>
				</a>
				<a class="market-price" href="financial_assets_marketing_detail.html?asset=cc_index_2129b&amp;return=index">
					<h3 data-i18n="market.cc_index_2129b"></h3>
					<p class="market-value" data-market-value="cc_index_2129b" data-i18n="market.loading"></p>
					<p class="market-unit" data-i18n="market.cc_index_unit"></p>
					<p class="market-unit" data-market-date="cc_index_2129b"></p>
				</a>
				<a class="market-price" href="financial_assets_marketing_detail.html?asset=usd_cny&amp;return=index">
					<h3 data-i18n="market.usd_cny"></h3>
					<p class="market-value" data-market-value="usd_cny" data-i18n="market.loading"></p>
					<p class="market-unit" data-i18n="market.usd_cny_unit"></p>
				</a>
			</div>
			<p class="market-status" id="market-status" role="status"></p>
			<p class="market-updated" id="market-updated"></p>
		</section>
		<section class="features" aria-label="Features">
			<article class="feature">
				<h2 data-i18n="site.public_feature_upload_title"></h2>
				<p data-i18n="site.public_feature_upload"></p>
			</article>
			<article class="feature">
				<h2 data-i18n="site.public_feature_analysis_title"></h2>
				<p data-i18n="site.public_feature_analysis"></p>
			</article>
			<article class="feature">
				<h2 data-i18n="site.public_feature_manage_title"></h2>
				<p data-i18n="site.public_feature_manage"></p>
			</article>
		</section>
	</main>
	<footer data-i18n="site.footer"></footer>
	<script src="api-config.js"></script>
	<script src="client.js"></script>
	<script src="app.js"></script>
</body>
</html>
