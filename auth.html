<!DOCTYPE html>
<html lang="${language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>${title}</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #233047; background: linear-gradient(145deg, #edf5f3, #f8f5ed); font-family: "Microsoft YaHei", sans-serif; }
        main { width: min(440px, 100%); padding: 36px; background: #fff; border: 1px solid #dfe8e5; border-radius: 12px; box-shadow: 0 18px 48px #23304714; }
        .eyebrow { margin: 0 0 10px; color: #087f70; font-size: 13px; font-weight: 700; }
        h1 { margin: 0; font-size: 30px; }
        .intro { margin: 10px 0 24px; color: #68758a; line-height: 1.7; }
        .notice { margin: 0 0 18px; padding: 12px 14px; color: #9c2f25; background: #fff0ed; border-radius: 6px; }
        .notice:empty { display: none; }
        .mode-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 22px; padding: 4px; background: #f1f5f4; border-radius: 8px; }
        .mode-switch button { min-height: 38px; color: #52615f; background: transparent; }
        .mode-switch button[aria-pressed="true"] { color: #087f70; background: #fff; box-shadow: 0 1px 4px #2330471a; }
        label { display: block; margin: 0 0 7px; color: #475467; font-size: 14px; font-weight: 700; }
        input { width: 100%; min-height: 44px; margin-bottom: 16px; padding: 10px 12px; color: #233047; background: #fff; border: 1px solid #cfd9d6; border-radius: 6px; font: inherit; }
        input:focus { outline: 3px solid #087f7030; border-color: #087f70; }
        button { min-height: 44px; width: 100%; padding: 0 18px; color: #fff; background: #087f70; border: 0; border-radius: 6px; font: inherit; font-weight: 700; cursor: pointer; }
        button:hover { background: #06695d; }
        .hint { margin: 12px 0 0; color: #68758a; font-size: 13px; line-height: 1.6; }
        .language-switch { position: absolute; top: 16px; right: 24px; font-size: 14px; }
        .language-switch a { color: #087f70; text-decoration: none; }
        .language-switch a:hover { text-decoration: underline; }
        @media (max-width: 640px) { main { padding: 24px; } }
    </style>
</head>
<body>
    ${language_switch}
    <main>
        <p class="eyebrow">${eyebrow}</p>
        <h1 id="page-title">${login}</h1>
        <p class="intro" id="page-intro">${login_intro}</p>
        <p class="notice" role="alert">${message}</p>
        <div class="mode-switch" role="group" aria-label="${mode_label}">
            <button id="login-mode" type="button" aria-pressed="true">${login}</button>
            <button id="register-mode" type="button" aria-pressed="false">${register}</button>
        </div>
        <form method="post" action="/auth" id="auth-form" data-mode="${mode}">
            <input type="hidden" name="next" value="${next_path}">
            <input type="hidden" name="mode" id="auth-mode" value="${mode}">
            <label for="username">${username_label}</label>
            <input id="username" name="username" autocomplete="username" minlength="3" maxlength="32" placeholder="${username_placeholder}" required>
            <label for="password">${password_label}</label>
            <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" placeholder="${password_placeholder}" required>
            <div id="confirmation-field" hidden>
                <label for="confirm-password">${confirm_password_label}</label>
                <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="${confirm_placeholder}">
                <p class="hint">${password_hint}</p>
            </div>
            <button type="submit" id="submit-button">${login}</button>
        </form>
    </main>
    <script>
        const messages = ${auth_messages};
        const form = document.getElementById("auth-form");
        const confirmationField = document.getElementById("confirmation-field");
        const confirmationInput = document.getElementById("confirm-password");
        const passwordInput = document.getElementById("password");

        function setMode(mode) {
            const registering = mode === "register";
            form.dataset.mode = mode;
            document.getElementById("auth-mode").value = mode;
            document.getElementById("page-title").textContent = registering ? messages.register : messages.login;
            document.getElementById("page-intro").textContent = registering
                ? messages.register_intro
                : messages.login_intro;
            document.getElementById("submit-button").textContent = registering ? messages.register_submit : messages.login;
            document.getElementById("login-mode").setAttribute("aria-pressed", String(!registering));
            document.getElementById("register-mode").setAttribute("aria-pressed", String(registering));
            confirmationField.hidden = !registering;
            confirmationInput.required = registering;
            passwordInput.autocomplete = registering ? "new-password" : "current-password";
            passwordInput.placeholder = registering
                ? messages.register_password_placeholder
                : messages.password_placeholder;
        }

        document.getElementById("login-mode").addEventListener("click", () => setMode("login"));
        document.getElementById("register-mode").addEventListener("click", () => setMode("register"));
        setMode(form.dataset.mode);
    </script>
</body>
</html>
